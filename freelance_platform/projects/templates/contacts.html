{% extends 'base.html' %}

{% block title %}Контакты{% endblock %}

{% block content %}
<div class="container">
    <div class="content-card">
        <h2 class="page-title">Контакты</h2>

        <div class="contact-grid">
            <div class="contact-info">
                <div class="info-group">
                    <h3>Адрес</h3>
                    <p>г. Новосибирск, ул. Ленина, д. 113</p>
                </div>

                <div class="info-group">
                    <h3>Телефон</h3>
                    <p>+7 (999) 123-45-67</p>
                </div>

                <div class="info-group">
                    <h3>Email</h3>
                    <p>support@freelance-platform.ru</p>
                </div>
            </div>

            <div class="contact-form">
                <h3>Написать нам</h3>
                <form method="post">
                    {% csrf_token %}
                    <div class="form-group">
                        <label for="name">Ваше имя:</label>
                        <input type="text" id="name" name="name" required>
                    </div>

                    <div class="form-group">
                        <label for="email">Email:</label>
                        <input type="email" id="email" name="email" required>
                    </div>

                    <div class="form-group">
                        <label for="message">Сообщение:</label>
                        <textarea id="message" name="message" required></textarea>
                    </div>

                    <button type="submit" class="submit-button">Отправить</button>
                </form>
            </div>
        </div>
    </div>
</div>

<style>
    .container {
        max-width: 1200px;
        margin: 0 auto;
        padding: 20px;
    }

    .content-card {
        background: white;
        border-radius: 10px;
        padding: 30px;
        box-shadow: 0 2px 5px rgba(0,0,0,0.1);
    }

    .page-title {
        color: #4CAF50;
        text-align: center;
        margin-bottom: 30px;
    }

    .contact-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 40px;
    }

    .contact-info {
        padding-right: 20px;
    }

    .info-group {
        margin-bottom: 20px;
    }

    .info-group h3 {
        color: #4CAF50;
        margin-bottom: 10px;
    }

    .contact-form {
        background: #f5f5f5;
        padding: 20px;
        border-radius: 8px;
    }

    .form-group {
        margin-bottom: 15px;
    }

    .form-group label {
        display: block;
        margin-bottom: 5px;
        color: #666;
    }

    .form-group input,
    .form-group textarea {
        width: 100%;
        padding: 8px;
        border: 1px solid #ddd;
        border-radius: 4px;
        box-sizing: border-box;
    }

    .form-group textarea {
        height: 120px;
        resize: vertical;
    }

    .submit-button {
        width: 100%;
        padding: 10px;
        background-color: #4CAF50;
        color: white;
        border: none;
        border-radius: 4px;
        cursor: pointer;
        transition: background-color 0.3s;
    }

    .submit-button:hover {
        background-color: #45a049;
    }

    @media (max-width: 768px) {
        .contact-grid {
            grid-template-columns: 1fr;
        }

        .contact-info {
            padding-right: 0;
        }
    }
</style>
{% endblock %}
