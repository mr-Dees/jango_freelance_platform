{% extends 'base.html' %}

{% block title %}Вход - Фриланс Платформа{% endblock %}

{% block extra_styles %}
<style>
    .form-container {
        max-width: 400px;
        margin: 40px auto;
        padding: 20px;
        background-color: white;
        border-radius: 10px;
        box-shadow: 0 2px 5px rgba(0,0,0,0.1);
    }

    .form-title {
        color: #4CAF50;
        margin-bottom: 20px;
        text-align: center;
    }

    .form-group {
        margin-bottom: 15px;
    }

    .form-group label {
        display: block;
        margin-bottom: 5px;
        color: #666;
    }

    .form-group input {
        width: 100%;
        padding: 8px;
        border: 1px solid #ddd;
        border-radius: 4px;
        box-sizing: border-box;
    }

    .form-button {
        width: 100%;
        padding: 10px;
        background-color: #4CAF50;
        color: white;
        border: none;
        border-radius: 4px;
        cursor: pointer;
        font-size: 16px;
    }

    .form-button:hover {
        background-color: #45a049;
    }

    .form-links {
        margin-top: 15px;
        text-align: center;
    }

    .form-links a {
        color: #4CAF50;
        text-decoration: none;
    }

    .form-links a:hover {
        text-decoration: underline;
    }

    .error-message {
        color: #f44336;
        margin-bottom: 15px;
        text-align: center;
    }
</style>
{% endblock %}

{% block content %}
<div class="form-container">
    <h2 class="form-title">Вход в систему</h2>
    
    {% if form.errors %}
        <div class="error-message">
            Неверное имя пользователя или пароль.
        </div>
    {% endif %}

    <form method="post">
        {% csrf_token %}
        <div class="form-group">
            <label for="username">Имя пользователя:</label>
            <input type="text" name="username" id="username" required>
        </div>
        <div class="form-group">
            <label for="password">Пароль:</label>
            <input type="password" name="password" id="password" required>
        </div>
        <button type="submit" class="form-button">Войти</button>
    </form>

    <div class="form-links">
        <p>Нет аккаунта? <a href="{% url 'register' %}">Зарегистрироваться</a></p>
    </div>
</div>
{% endblock %}
